<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 정보 수정</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/accounts/user-update.css">
</head>
<body>
    <div id="menu"></div>
    <main class="user-update-page">
        <div class="user-update-container">
            <div class="user-update-header">
                <span class="page-label">ACCOUNT</span>
                <h1>회원 정보 수정</h1>
                <p>회원님의 정보를 수정할 수 있습니다.</p>
            </div>
            <form id="userUpdateForm">
                <!-- 기본 정보 -->
                <section class="update-section">
                    <h2>기본 정보</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="userId">아이디</label>
                            <input type="text" id="userId" disabled>
                            <small> 아이디는 변경할 수 없습니다. </small>
                        </div>
                        <div class="form-group">
                            <label for="userName">이름</label>
                            <input type="text" id="userName" name="userName">
                        </div>
                        <div class="form-group">
                            <label for="email">이메일</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="form-group">
                            <label for="phoneNumber">전화번호</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber">
                        </div>
                        <div class="form-group">
                            <label for="gender">성별</label>
                            <select id="gender" name="gender">
                                <option value="">선택</option>
                                <option value="M">남성</option>
                                <option value="F">여성</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="birthDate">생년월일</label>
                            <input type="date" id="birthDate" name="birthDate">
                        </div>
                    </div>
                </section>
                <!-- 주소 -->
                <section class="update-section">
                    <h2>주소 정보</h2>
                    <div class="form-grid">
                        <div class="form-group zipcode-group">
                            <label for="zipCode">우편번호</label>
                            <div class="zipcode-row">
                                <input type="text" id="zipCode" name="zipCode" readonly>
                                <button type="button" id="addressSearchBtn" onclick="addr_search();"> 주소 검색 </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="baseAddress">기본주소</label>
                            <input type="text" id="baseAddress" name="baseAddress" readonly>
                        </div>
                        <div class="form-group full-width">
                            <label for="detailAddress">상세주소</label>
                            <input type="text" id="detailAddress" name="detailAddress">
                        </div>
                    </div>
                </section>
                <div id="updateMessage" class="update-message"></div>
                <div class="update-actions">
                    <button type="submit" class="update-button" id="updateButton"> 회원 정보 수정 </button>
                    <button type="button" class="cancel-button" onclick="goToMyPage()"> 취소 </button>
                </div>
            </form>
        </div>
    </main>
    <div id="footer"></div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/accounts/user-update.js"></script>
</body>
</html>
