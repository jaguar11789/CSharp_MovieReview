<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입 - Movie Review</title>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/accounts/register.css" />
</head>

<body>
    <!-- 공통 메뉴 -->
    <div id="menu"></div>
    <main>
        <div class="container register-container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                    <div class="register-card">
                        <h2 class="register-title">회원가입</h2>
                        <form id="registerForm">
                            <!-- 아이디 -->
                            <div class="mb-3">
                                <label for="userId" class="form-label">아이디</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="userId" autocomplete="off" placeholder="아이디를 입력하세요." required>
                                    <button type="button" id="checkUserIdBtn" class="btn btn-outline-secondary">중복확인</button>
                                </div>
                                <div id="id_ok" class="text-success mt-1 d-none">
                                    사용 가능한 아이디입니다.
                                </div>

                                <div id="id_already" class="text-danger mt-1 d-none">
                                    이미 사용 중인 아이디입니다.
                                </div>
                            </div>
                            <!-- 비밀번호 -->
                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요." required>
                            </div>
                            <!-- 비밀번호 확인 -->
                            <div class="mb-3">
                                <label for="passwordCheck" class="form-label">비밀번호 확인</label>
                                <input type="password" class="form-control" id="passwordCheck" placeholder="비밀번호를 다시 입력하세요." required>
                                <div id="pwd_ok" class="text-success mt-1 d-none">
                                    비밀번호가 일치합니다.
                                </div>
                                <div id="pwd_no" class="text-danger mt-1 d-none">
                                    비밀번호가 일치하지 않습니다.
                                </div>
                            </div>
                            <!-- 이름 -->
                            <div class="mb-3">
                                <label for="name" class="form-label">이름</label>
                                <input type="text" class="form-control" id="userName" placeholder="이름을 입력하세요." required>
                            </div>
                            <!-- 이메일 -->
                            <div class="mb-3">
                                <label for="email" class="form-label">이메일</label>
                                <input type="email" class="form-control" id="email" placeholder="이메일을 입력하세요." required>
                            </div>
                            <!-- 성별 -->
                            <div class="mb-3">
                                <label for="gender" class="form-label">성별</label>
                                <select id="gender" class="form-select" required>
                                    <option value="">성별을 선택하세요.</option>
                                    <option value="M">남성</option>
                                    <option value="F">여성</option>
                                </select>
                            </div>
                            <!-- 생년월일 -->
                            <div class="mb-3">
                                <label for="birth_date" class="form-label">생년월일</label>
                                <input type="date" class="form-control" id="birth_date" required>
                            </div>
                            <!-- 전화번호 -->
                            <div class="mb-3">
                                <label for="telnum" class="form-label">전화번호</label>
                                <input type="tel" class="form-control" id="telnum" placeholder="전화번호를 입력하세요. (- 제외)" required>
                            </div>
                            <!-- 주소 -->
                            <div class="mb-3">
                                <label class="form-label">주소</label>
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" id="zipcode" placeholder="우편번호" readonly required>
                                    <button type="button" onclick="addr_search();" class="btn btn-outline-secondary">주소검색</button>
                                </div>
                                <input type="text" class="form-control mb-2" id="base_addr" placeholder="기본주소" readonly required>
                                <input type="text" class="form-control" id="dtl_addr" placeholder="상세주소를 입력하세요." required>
                            </div>
                            <!-- 버튼 -->
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn register-submit flex-fill">가입하기</button>
                                <button type="button" id="cancelBtn" class="btn register-cancel flex-fill">취소</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- 공통 푸터 -->
    <div id="footer"></div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <!--<script src="/js/bootstrap.min.js"></script>-->
    <script src="/js/common.js"></script>
    <!-- Daum 우편번호 -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <!-- 회원가입 전용 JS -->
    <script src="/js/accounts/register.js"></script>
</body>
</html>
