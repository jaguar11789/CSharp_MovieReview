<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>비밀번호 변경</title>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/accounts/password-change.css" />
</head>

<body>
    <div id="menu"></div>
    <main class="password-page">
        <div class="password-card">
            <div class="password-header">
                <h2>비밀번호 변경</h2>
                <p>안전한 비밀번호로 계정을 보호하세요.</p>
            </div>
            <form id="passwordChangeForm">
                <div class="password-field">
                    <label for="currentPassword" class="form-label">현재 비밀번호</label>
                    <input type="password" id="currentPassword" class="form-control" placeholder="현재 비밀번호를 입력하세요" autocomplete="current-password" required>
                </div>
                <div class="password-field">
                    <label for="newPassword" class="form-label">새 비밀번호</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="새 비밀번호를 입력하세요" autocomplete="new-password" required>
                </div>
                <div class="password-field">
                    <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="새 비밀번호를 다시 입력하세요" autocomplete="new-password" required>
                </div>
                <button type="submit" id="changePasswordBtn" class="password-button">비밀번호 변경</button>
                <div id="passwordMessage" class="password-message"></div>
            </form>
            <div class="password-notice">
                <strong>비밀번호 변경 안내</strong>
                <br>
                현재 비밀번호를 확인한 후 새 비밀번호로 변경됩니다.
            </div>
        </div>
    </main>
    <div id="footer"></div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/accounts/password-change.js"></script>

</body>
</html>
