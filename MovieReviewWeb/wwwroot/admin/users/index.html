<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원 관리</title>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/admin/admin.css">
    <link rel="stylesheet" href="/css/admin/admin-users.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="admin-menu"></div>
    <main class="admin-page">

        <section class="admin-hero">
            <div>
                <span class="admin-label">USER MANAGEMENT</span>
                <h1>회원 관리</h1>
                <p>영화 리뷰 서비스에 가입한 회원을 관리합니다.</p>
            </div>
        </section>

        <!-- 회원 목록 -->
        <section class="admin-content-section">

            <div class="admin-section-header">
                <div>
                    <span class="section-label">USERS</span>
                    <h2>회원 목록</h2>
                </div>
            </div>
            <section class="admin-filter-section">

                <div class="admin-filter-row">

                    <!-- 검색 : 왼쪽 -->
                    <div class="admin-search-box">
                        <input type="text" id="searchKeyword" class="form-control" placeholder="회원 아이디, 이름 또는 이메일 검색">
                        <button type="button" id="searchButton" class="btn btn-dark">검색</button>
                    </div>

                    <!-- 필터 : 오른쪽 -->
                    <div class="admin-filter-group">
                        <div class="admin-filter-item">
                            <label for="statusFilter">상태</label>
                            <select id="statusFilter" class="form-select">
                                <option value="">전체</option>
                                <option value="100">정상</option>
                                <option value="200">휴면</option>
                                <option value="300">정지</option>
                                <option value="900">탈퇴</option>
                            </select>
                        </div>


                        <div class="admin-filter-item">
                            <label for="joinPeriodFilter">가입일</label>
                            <select id="joinPeriodFilter" class="form-select">
                                <option value="">전체</option>
                                <option value="1">오늘</option>
                                <option value="7">최근 7일</option>
                                <option value="30">최근 30일</option>
                                <option value="90">최근 3개월</option>
                                <option value="365">최근 1년</option>
                            </select>

                        </div>

                        <div class="admin-filter-item">
                            <label for="pageSizeSelect">보기</label>
                            <select id="pageSizeSelect" class="form-select">
                                <option value="10">10개</option>
                                <option value="20">20개</option>
                                <option value="50">50개</option>
                            </select>
                        </div>
                    </div>
                </div>

            </section>
            <div class="admin-table-wrapper">
                <table class="table admin-table">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">회원 아이디</th>
                            <th scope="col">이메일</th>
                            <th scope="col">권한</th>
                            <th scope="col">가입일</th>
                            <th scope="col">상태</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <tr>
                            <td colspan="6">
                                회원 정보를 불러오는 중입니다.
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div id="userPagination" class="admin-pagination"></div>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin/admin-common.js"></script>
    <script src="/js/admin/admin-users.js"></script>
</body>
</html>
