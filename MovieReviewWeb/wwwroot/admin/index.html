<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <!--<link rel="stylesheet" href="/css/main.css">-->
    <link rel="stylesheet" href="/css/admin/admin.css">
</head>
<body>
    <div id="admin-menu"></div>
    <main class="admin-page">

        <!-- 관리자 페이지 헤더 -->
        <section class="admin-hero">
            <div>
                <span class="admin-label">ADMIN</span>
                <h1>관리자 대시보드</h1>
                <p>영화 리뷰 서비스의 주요 현황을 확인할 수 있습니다.</p>
            </div>
        </section>

        <!-- 통계 카드 -->
        <section class="admin-stat-section">
            <div class="admin-stat-card">
                <div class="admin-stat-icon">
                    👤
                </div>
                <div class="admin-stat-info">
                    <span>전체 회원</span>
                    <strong id="totalUsers">-</strong>
                </div>
            </div>
            <div class="admin-stat-card">
                <div class="admin-stat-icon">
                    🟢
                </div>
                <div class="admin-stat-info">
                    <span>활성 회원</span>
                    <strong id="activeUsers">-</strong>
                </div>
            </div>
            <div class="admin-stat-card">
                <div class="admin-stat-icon">
                    💬
                </div>
                <div class="admin-stat-info">
                    <span>전체 리뷰</span>
                    <strong id="totalReviews">-</strong>
                </div>
            </div>

            <div class="admin-stat-card">
                <div class="admin-stat-icon">
                    ⭐
                </div>
                <div class="admin-stat-info">
                    <span>평균 평점</span>
                    <strong id="averageRating">-</strong>
                </div>
            </div>
        </section>


        <!-- 관리 메뉴 -->
        <section class="admin-management-section">
            <div class="admin-section-header">
                <div>
                    <span class="section-label">MANAGEMENT</span>
                    <h2>관리 기능</h2>
                </div>
            </div>


            <div class="admin-management-grid">
                <button type="button" class="admin-management-card" id="userManagementButton">
                    <div class="admin-management-icon">
                        👥
                    </div>
                    <div>
                        <h3>회원 관리</h3>
                        <p>회원 정보 및 계정 상태를 관리합니다.</p>
                    </div>
                    <span class="admin-card-arrow">→</span>
                </button>
                <button type="button" class="admin-management-card" id="reviewManagementButton">
                    <div class="admin-management-icon">
                        📝
                    </div>
                    <div>
                        <h3>리뷰 관리</h3>
                        <p>등록된 리뷰와 리뷰 상태를 관리합니다.</p>
                    </div>
                    <span class="admin-card-arrow">→</span>
                </button>
            </div>
        </section>


        <!-- 최근 활동 -->
        <section class="admin-recent-section">
            <div class="admin-section-header">
                <div>
                    <span class="section-label">RECENT ACTIVITY</span>
                    <h2>최근 활동</h2>
                </div>
            </div>

            <div id="adminRecentActivity" class="admin-recent-list">
                <div class="admin-empty">
                    최근 활동이 없습니다.
                </div>
            </div>
        </section>

    </main>
    <div id="footer"></div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin/admin-common.js"></script>
</body>
</html>
